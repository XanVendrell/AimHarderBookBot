name: Bot de Reservas Aimharder

on:
  schedule:
    # Todos los domingos a las 17:31h España (CEST, UTC+2 -> 15:31 UTC)
    - cron: '31 15 * * 0'
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      command_args:
        description: 'Argumentos de ejecución (ej: --week, --book, --test)'
        required: false
        default: '--week'

jobs:
  run-booking:
    name: Ejecutar Reserva Automática
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Bot Aimharder
        env:
          AIMHARDER_EMAIL: ${{ secrets.AIMHARDER_EMAIL }}
          AIMHARDER_PASSWORD: ${{ secrets.AIMHARDER_PASSWORD }}
          BOX_URL: ${{ secrets.BOX_URL }}
          BOX_ID: ${{ secrets.BOX_ID }}
          TARGET_TIME: ${{ secrets.TARGET_TIME }}
          TARGET_CLASS_NAME: ${{ secrets.TARGET_CLASS_NAME }}
          TARGETS: ${{ secrets.TARGETS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python main.py ${{ github.event.inputs.command_args }}
          else
            python main.py --week
          fi
